# =============================================================================
# Vision_Suite — Master Configuration
# Version: 0.2.0
# =============================================================================

config_version: "2.0"

project:
  name: "Vision_Suite"
  version: "0.2.0"
  environment: "development"

# -----------------------------------------------------------------------------
# RUNTIME
# -----------------------------------------------------------------------------
runtime:
  device: "cpu"
  random_seed: 42
  deterministic: true
  num_threads: 4
  multiprocessing: false
  graceful_shutdown: true

# -----------------------------------------------------------------------------
# PATHS
# All relative paths resolve against the project root.
# -----------------------------------------------------------------------------
paths:
  models_dir: "models"
  data_dir: "data"
  raw_faces_dir: "data/faces/raw"
  processed_faces_dir: "data/faces/processed"
  embeddings_dir: "data/embeddings"
  database_dir: "data/database"
  output_dir: "output"
  logs_dir: "output/logs"
  crops_dir: "output/crops"
  reports_dir: "output/reports"
  temporary_dir: "output/tmp"

  # Preserve the existing database until migration is implemented.
  legacy_face_db_path: "models/face_recognition/face_db.pkl"

# -----------------------------------------------------------------------------
# INPUT SOURCES
# Supported types: web_cam, video, live
# -----------------------------------------------------------------------------
input:
  type: "web_cam"

  camera_indices: [1]
  video_paths:
    - "data/sample_videos/sample.mp4"

  # Do not commit real credentials in this file.
  # Use environment-variable references or a secrets manager.
  rtsp_urls: []

  reconnect_delay_seconds: 5
  max_reconnect_attempts: 0  # 0 = retry indefinitely
  open_timeout_seconds: 10
  read_timeout_seconds: 10
  transport: "tcp"

  buffer:
    max_frames: 2
    drop_oldest: true

  display_resolution: null
  inference_resolution: null

  # Optional per-source overrides; implement in the source manager.
  # camera_settings applies brightness, contrast, saturation, exposure, focus, gain.
  sources: []
  # Example:
  #   - id: "camera_01"
  #     type: "web_cam"
  #     index: 0
  #     enabled: true
  #     camera_settings:
  #       brightness: 128
  #       contrast: 128
  #       saturation: 128
  #       exposure: 150
  #       focus: 60
  #       gain: 100

# -----------------------------------------------------------------------------
# PERFORMANCE
# -----------------------------------------------------------------------------
performance:
  frame_skip: 0
  inference_interval_ms: 0
  max_inference_fps: 0  # 0 = unlimited by this setting
  warmup_iterations: 3
  resize_before_inference: true

  # Useful when multiple sources compete for CPU resources.
  max_concurrent_inferences: 1
  batch_size: 1

  profiling:
    enabled: false
    report_interval_seconds: 30
    measure_preprocessing: true
    measure_inference: true
    measure_postprocessing: true

# -----------------------------------------------------------------------------
# MODELS
# -----------------------------------------------------------------------------
models:
  download_policy: "if_missing"  # never, if_missing, always
  verify_downloads: true
  cache_enabled: true

  onnx_providers:
    - "CPUExecutionProvider"

  object_detection:
    enabled: true
    backend: "ultralytics"
    name: "yolov8n"
    weights_path: "models/detection/yolov8n.pt"
    weights_url: "https://github.com/ultralytics/assets/releases/download/v8.2.0/yolov8n.pt"
    input_size: [640, 640]
    confidence_threshold: 0.45
    iou_threshold: 0.45
    classes_filter: null

  face_detection:
    enabled: true
    backend: "insightface"
    name: "scrfd"
    pack_name: "buffalo_s"
    weights_filename: "yolov8n-face.onnx"
    weights_url: "https://github.com/derronqi/yolov8-face/releases/download/v0.1/yolov8n-face.onnx"
    confidence_threshold: 0.50
    nms_iou_threshold: 0.45
    input_size: [640, 640]
    min_face_size_px: 40

  face_recognition:
    enabled: true
    backend: "insightface"
    model_name: "arcface"
    pack_name: "buffalo_s"
    embedding_size: 512
    normalize_embeddings: true
    inference_provider: "CPUExecutionProvider"

# -----------------------------------------------------------------------------
# FACE RECOGNITION
# Keep recognition policy in one place.
# -----------------------------------------------------------------------------
recognition:
  similarity_metric: "cosine"
  similarity_threshold: 0.45
  unknown_label: "unknown"

  matching:
    top_k: 5
    minimum_margin: 0.05
    require_quality_check: true

  temporal_confirmation:
    enabled: true
    min_consecutive_matches: 3
    voting_window: 5

  duplicate_embedding_threshold: 0.98
  save_crops: true
  crop_dir: "output/crops/recognized"
  cooldown_seconds: 5

# -----------------------------------------------------------------------------
# DATA COLLECTION AND ENROLLMENT
# -----------------------------------------------------------------------------
data_collection:
  output_root: "data/faces/raw"
  samples_per_pose: 15
  capture_interval_seconds: 0.3
  max_samples_per_person: 300
  allowed_image_extensions: [".jpg", ".jpeg", ".png"]

  poses:
    - "straight"
    - "left"
    - "right"
    - "up"
    - "down"

  quality_checks:
    enabled: true
    min_brightness: 60
    max_brightness: 200
    blur_threshold: 100
    min_face_size_px: 80
    reject_multiple_faces: true
    reject_duplicate_images: true

enrollment:
  auto_generate_identity_code: true
  identity_code_prefix: "EMP"
  default_name: "Mayank"
  default_employee_id: "001"
  require_unique_employee_id: true
  overwrite_if_exists: true
  require_confirmation_for_overwrite: true
  require_minimum_samples: 10
  generate_embeddings_after_collection: true
  allow_incremental_enrollment: true

  metadata_fields:
    - "employee_id"
    - "department"

# -----------------------------------------------------------------------------
# EMBEDDING DATABASE
# -----------------------------------------------------------------------------
database:
  backend: "sqlite"
  sqlite_path: "data/database/faces.db"

  embedding_index:
    backend: "faiss"
    index_type: "FlatIP"
    normalize_vectors: true

  persistence:
    autosave: true
    backup_enabled: true
    backup_interval_hours: 24

# -----------------------------------------------------------------------------
# TRACKING
# -----------------------------------------------------------------------------
tracking:
  enabled: true
  type: "iou"
  iou_threshold: 0.30
  max_age: 30
  min_hits: 3

  # Optional identity-level tracking.
  identity_smoothing:
    enabled: true
    history_size: 5
    minimum_votes: 3

# -----------------------------------------------------------------------------
# CROPS AND OUTPUT
# -----------------------------------------------------------------------------
crops:
  save_object_crops: true
  save_face_crops: true
  crop_padding: 10
  min_crop_size: 40
  cooldown_seconds: 5

  object_crop_dir: "output/crops/objects"
  face_crop_dir: "output/crops/faces"
  unknown_crop_dir: "output/crops/unknown"

output:
  save_detection_results: true
  save_event_csv: true
  save_annotated_video: false
  image_format: "jpg"
  jpeg_quality: 90

# -----------------------------------------------------------------------------
# LOGGING AND EVENTS
# -----------------------------------------------------------------------------
logging:
  level: "INFO"
  max_bytes: 5242880
  backup_count: 5
  console_enabled: true
  file_enabled: true
  structured_json: false

events:
  enabled: true
  cooldown_seconds: 10
  include_unknown_faces: true

  csv_columns:
    - "timestamp"
    - "event_type"
    - "camera_id"
    - "class_or_name"
    - "confidence"
    - "bbox_x1"
    - "bbox_y1"
    - "bbox_x2"
    - "bbox_y2"
    - "crop_path"
    - "track_id"

# -----------------------------------------------------------------------------
# DISPLAY
# -----------------------------------------------------------------------------
resolution:
  display:
    width: 1280
    height: 720
  inference:
    width: 640
    height: 480

display:
  mode: "grid"
  grid_columns: 2
  window_name_prefix: "Vision_Suite"
  show_fps: true
  show_confidence: true
  show_track_id: true
  show_unknown_label: true
  bbox_thickness: 3
  tight_bbox: true
  circle_overlay: true
  show_landmarks: true
  enrollment_visuals: true

# -----------------------------------------------------------------------------
# FEATURE FLAGS
# -----------------------------------------------------------------------------
features:
  object_detection: true
  face_detection: true
  face_recognition: true
  tracking: true
  data_collection: true
  event_logging: true
  ear_mar: false
  anti_spoofing: false

# -----------------------------------------------------------------------------
# EVALUATION AND BENCHMARKING
# -----------------------------------------------------------------------------
evaluation:
  enabled: false
  dataset_dir: "data/evaluation"
  output_dir: "output/reports"

  recognition_metrics:
    - "precision"
    - "recall"
    - "false_acceptance_rate"
    - "false_rejection_rate"

  benchmark:
    enabled: false
    warmup_iterations: 5
    measurement_iterations: 100
    report_cpu_memory: true
    report_latency_percentiles: true

# -----------------------------------------------------------------------------
# PRIVACY AND DATA RETENTION
# -----------------------------------------------------------------------------
privacy:
  delete_raw_faces_after_enrollment: false
  unknown_crop_retention_days: 30
  event_retention_days: 90
  require_authorized_enrollment: true
